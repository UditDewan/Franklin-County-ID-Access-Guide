name: build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The parity and DOM tests need node. jsdom sets a minimum Node version in
      # its engines field, so this has to stay at or above it: on Node 20 the
      # install succeeds and then fails at require time.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: pip install -r requirements.txt

      # jsdom drives the built page the way a person would.
      - run: npm install --no-fund --no-audit

      - name: Validate the content
        run: python -m src.validate

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: python -m src.build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
